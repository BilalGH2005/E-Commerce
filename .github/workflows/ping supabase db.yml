name: Ping Supabase Ecommerce Project to Prevent Pausing

on:
  schedule:
    - cron: '0 9 * * 1,4' # Runs at 9:00 AM UTC every Monday and Thursday
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use Node.js 18

      # Step 3: Install Supabase Client
      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --force

      # Step 4: Ping Supabase
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_URL }} # Supabase project URL
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROJECT_SERVICE_ROLE_KEY }} # Supabase service role key
        run: |
          node -e "
          (async () => {
            try {
              // Validate and normalize environment variables
              const rawUrl = process.env.SUPABASE_URL;
              const key = process.env.SUPABASE_KEY;
              if (!rawUrl || !key) {
                throw new Error('Missing SUPABASE_URL or SUPABASE_KEY secret');
              }
              const normalizedUrl = /^https?:\/\//i.test(rawUrl) ? rawUrl : 'https://' + rawUrl;

              // Import Supabase client
              const { createClient } = require('@supabase/supabase-js');
              const supabase = createClient(normalizedUrl, key);

              // Ping Supabase with lightweight query and retry for transient network failures
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                const { error } = await supabase.from('products').select('id').limit(1);
                if (!error) {
                  console.log('Ping successful');
                  return;
                }
                lastError = error;
                if (attempt < 3) {
                  await new Promise((resolve) => setTimeout(resolve, 2000));
                }
              }

              throw lastError;
            } catch (err) {
              // Log and exit with error
              console.error('Error pinging Supabase:', err.stack || err.message);
              process.exit(1);
            }
          })();
          "
